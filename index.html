<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dual Camera</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="header-bar">
      <h1>Dual Camera</h1>
    </header>

    <main class="content">
      <div class="camera-stack">
        <video id="verticalFrame" autoplay playsinline muted webkit-playsinline="true" aria-label="Vertical camera frame"></video>
        <video id="wideFrame" autoplay playsinline muted webkit-playsinline="true" aria-label="Wide camera frame"></video>
      </div>

      <button id="startBtn" type="button">Start Camera</button>
      <p id="errorMessage" role="alert" hidden></p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
