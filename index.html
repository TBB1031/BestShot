<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dual Camera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="header-bar">
      <h1>Dual Camera</h1>
    </header>

    <main class="content">
      <div class="camera-stack">
        <video id="verticalFrame" autoplay playsinline muted webkit-playsinline="true" aria-label="Vertical camera frame"></video>
        <video id="wideFrame" autoplay playsinline muted webkit-playsinline="true" aria-label="Wide camera frame"></video>
      </div>

      <div class="controls">
        <button id="startBtn" type="button" aria-pressed="false">Start Camera</button>
        <button id="switchBtn" type="button" disabled>Switch Camera</button>
        <button id="photoBtn" type="button" disabled>Take Photo</button>
        <button id="recordBtn" type="button" disabled aria-pressed="false">Record Video</button>
      </div>
      <p id="errorMessage" role="alert" hidden></p>
      <canvas id="captureCanvas" hidden></canvas>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
