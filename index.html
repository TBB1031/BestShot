<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dual Camera</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="header">
    <h1>Dual Camera</h1>
  </header>

  <main>
    <div class="camera-stack">
      <video
        id="verticalFrame"
        autoplay
        playsinline
        muted
      ></video>

      <video
        id="wideFrame"
        autoplay
        playsinline
        muted
      ></video>
    </div>

    <div class="controls">
      <button id="startBtn">Start Camera</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
